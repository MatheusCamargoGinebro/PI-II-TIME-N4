<!--
    Autor: 
    projects_list.html -> Tela de listagem de projetos visíveis ao usuário autenticado com busca, filtros e criação de projeto (Administrador).
-->

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TaskOps - Projetos</title>

		<link rel="stylesheet" href="./projects_list.css" />
		<script src="https://unpkg.com/lucide@latest"></script>
	</head>

	<body>
		<header id="app-header" class="header"></header>

		<main class="container">
			<div class="projects-content">
				<!-- Título e botão criar projeto (somente Administrador) -->
				<div class="projects-header">
					<div class="projects-header-info">
						<h2 class="text-primary">Projetos</h2>
						<p
							class="font-inter text-regular text-subtitle"
							id="projects-summary"
						>
							Carregando projetos...
						</p>
					</div>
					<button
						type="button"
						id="create-project-btn"
						class="btn btn-lg primary-btn"
						data-admin-only
					>
						<i
							data-lucide="plus"
							class="icon-medium"
							style="color: var(--color-accent-100)"
						></i>
						Criar Projeto
					</button>
				</div>

				<!-- Filtros e busca -->
				<div class="projects-toolbar">
					<ul class="tab-bar project-filter-tabs" aria-label="Filtrar projetos">
						<li>
							<button type="button" class="tab tab-active" data-filter="todos">
								Todos
							</button>
						</li>
						<li>
							<button type="button" class="tab" data-filter="ativos">
								Em andamento
							</button>
						</li>
						<li>
							<button type="button" class="tab" data-filter="concluidos">
								Concluídos
							</button>
						</li>
						<li>
							<button type="button" class="tab" data-filter="sem_demandas">
								Sem demandas
							</button>
						</li>
					</ul>

					<label class="search-input">
						<i
							data-lucide="search"
							class="icon-medium"
							style="color: var(--color-neutral-600)"
						></i>
						<input
							id="project-search"
							type="search"
							placeholder="Buscar projetos"
							aria-label="Buscar projetos"
						/>
					</label>
				</div>

				<!-- Lista dinâmica de projetos -->
				<div class="projects-list" id="projects-list"></div>
				<p id="projects-empty-state" class="projects-empty-state" hidden>
					Nenhum projeto encontrado.
				</p>
			</div>
		</main>

		<script type="module" src="./projects_list.js"></script>
	</body>
</html>
