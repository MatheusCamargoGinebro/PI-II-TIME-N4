<!--
    Autor: 
    project_members.html -> Tela de listagem e vínculo de membros em um projeto específico.
-->

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TaskOps - Membros do Projeto</title>

		<link rel="stylesheet" href="./project_members.css" />
		<script src="https://unpkg.com/lucide@latest"></script>
	</head>

	<body>
		<header id="app-header" class="header"></header>

		<main class="container">
			<div class="project-members-content">
				<!-- Cabeçalho (Breadcrumb + Título + Botão) -->
				<div class="project-members-header">
					<div class="project-members-header-info">
						<div class="breadcrumb">
							<a
								href="../projects_list/projects_list.html"
								class="breadcrumb-item"
								>Projetos</a
							>
							<i data-lucide="chevron-right" class="breadcrumb-separator"></i>
							<a
								id="members-project-breadcrumb"
								href="../project_details/project_details.html"
								class="breadcrumb-item"
								>Carregando...</a
							>
							<i data-lucide="chevron-right" class="breadcrumb-separator"></i>
							<span class="breadcrumb-item active">Membros</span>
						</div>
						<h2 id="members-page-title" class="text-primary">Membros</h2>
					</div>
					<button
						type="button"
						id="add-member-btn"
						class="btn btn-lg primary-btn"
						data-manager-only
					>
						<i
							data-lucide="plus"
							class="icon-medium"
							style="color: var(--color-accent-100)"
						></i>
						Adicionar Membro
					</button>
				</div>

				<!-- Abas (Painel / Membros) -->
				<div class="project-members-toolbar">
					<ul class="tab-bar">
						<li>
							<a
								id="members-panel-tab"
								href="../project_details/project_details.html"
								class="tab"
								>Painel</a
							>
						</li>
						<li><div class="tab tab-active">Membros</div></li>
					</ul>
				</div>

				<!-- Filtros -->
				<div class="members-filters">
					<label class="search-input">
						<i
							data-lucide="search"
							class="icon-medium"
							style="color: var(--color-neutral-600)"
						></i>
						<input
							id="member-search"
							type="search"
							placeholder="Buscar membros por nome, e-mail ou perfil"
							aria-label="Buscar membros"
						/>
					</label>
					<label class="member-activity-filter">
						<span>Atividade</span>
						<select id="member-activity">
							<option value="">Todos os membros</option>
							<option value="pendentes">Com tarefas em aberto</option>
							<option value="concluidas">Concluíram todas as tarefas</option>
						</select>
					</label>
					<p
						id="member-count"
						class="text-subtitle text-small"
						aria-live="polite"
					></p>
				</div>

				<!-- Grid dinâmico de Membros -->
				<div class="project-members-grid" id="project-members-grid"></div>
			</div>
		</main>

		<script type="module" src="./project_members.js"></script>
	</body>
</html>
