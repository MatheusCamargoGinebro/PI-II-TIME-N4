<!--
    Autor: 
    project_member_details.html -> Tela de detalhes de um membro específico dentro de um projeto e suas demandas atribuídas.
-->

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TaskOps - Detalhes do Membro</title>

		<link rel="stylesheet" href="../project_members/project_members.css" />
		<link rel="stylesheet" href="../../dashboard/dashboard.css" />
		<script src="https://unpkg.com/lucide@latest"></script>
	</head>

	<body>
		<header id="app-header" class="header"></header>

		<main class="container">
			<div class="project-members-content">
				<div class="project-members-header">
					<div class="project-members-header-info">
						<div class="breadcrumb">
							<a
								href="../projects_list/projects_list.html"
								class="breadcrumb-item"
								>Projetos</a
							>
							<i data-lucide="chevron-right" class="breadcrumb-separator"></i>
							<a
								href="../project_details/project_details.html"
								class="breadcrumb-item project-link"
								>Projeto</a
							>
							<i data-lucide="chevron-right" class="breadcrumb-separator"></i>
							<a
								href="../project_members/project_members.html"
								class="breadcrumb-item members-link"
								>Membros</a
							>
							<i data-lucide="chevron-right" class="breadcrumb-separator"></i>
							<span class="breadcrumb-item active member-name-breadcrumb"
								>Detalhes</span
							>
						</div>
						<h2 class="text-primary member-title">Detalhes do Membro</h2>
					</div>
				</div>

				<div class="base-card" style="padding: 24px">
					<div class="align-center gap-16">
						<img
							id="member-avatar"
							src="../../../assets/images/user.png"
							alt="Avatar"
							style="
								width: 64px;
								height: 64px;
								border-radius: 50%;
								object-fit: cover;
							"
						/>
						<div>
							<h3
								id="member-name"
								class="text-primary text-large text-weight-bold"
							>
								Carregando...
							</h3>
							<p
								id="member-email"
								class="text-subtitle font-inter text-regular"
							></p>
							<p
								id="member-role"
								class="text-subtitle font-inter text-small"
							></p>
						</div>
					</div>
				</div>

				<div class="base-card" style="padding: 20px">
					<h3 class="text-primary text-large" style="margin-bottom: 16px">
						Demandas atribuídas neste projeto
					</h3>

					<div class="dashboard-tasks-table-wrapper">
						<table class="dashboard-tasks-table">
							<thead>
								<tr>
									<th>Código</th>
									<th>Demanda</th>
									<th>Tipo</th>
									<th>Prioridade</th>
									<th>Status</th>
									<th>Prazo</th>
								</tr>
							</thead>
							<tbody id="member-tasks-body">
								<tr>
									<td
										colspan="6"
										class="text-subtitle"
										style="text-align: center; padding: 16px"
									>
										Carregando tarefas...
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</main>

		<script type="module" src="./project_member_details.js"></script>
	</body>
</html>
