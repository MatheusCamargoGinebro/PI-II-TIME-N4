<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="register.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  		
</head>
<body>
  <main>

    <section class="lado-form">
      <form class="form" novalidate>
        <div class=" align-center  gap-8">
        
        <a href="../login/login.html" class="voltar"><i size="24" data-lucide="arrow-left" ></i></a>
      <img src="img/logo.png" alt="Logo" class="logo"></div>
        

        <p class="text-large text-weight-semibold text-subtitle">Preencha seus dados abaixo.</p>
        <h1 class="h1 text-primary">Cadastre-se</h1>

        <label class="text-label text-regular font-inter" for="nome">Digite seu nome:</label>
        <input class="input" type="text" id="nome" placeholder="Fulano da Silva" autocomplete="name" maxlength="100" required aria-describedby="erroNome">
        <div id="erroNome" class="invalid-feedback" aria-live="polite"></div>

        <label class="text-label text-regular font-inter" for="email">Digite seu endereço de e-mail:</label>
        <input class="input" type="email" id="email" placeholder="fulano@gmail.com" autocomplete="email" required aria-describedby="erroEmail">
        <div id="erroEmail" class="invalid-feedback" aria-live="polite"></div>

        <label class="text-label text-regular font-inter" for="senha">Crie sua senha:</label>
        <input class="input" type="password" id="senha" placeholder="••••••••" autocomplete="new-password" required aria-describedby="ajudaSenha erroSenha">
      
        <div id="erroSenha" class="invalid-feedback" ></div>

        <button class="btn btn-full btn-lg primary-btn h6" type="submit">Criar conta</button>
        <p id="mensagemFormulario" class="mensagem-formulario" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="lado-imagem">
      <img src="img/lateral.png" alt="">
    </section>

  </main>
  <script >
			lucide.createIcons();
		</script>
  <script src="register.js"></script>
</body>
</html>
