<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <main class="container">

    <section class="lado-form">
      <form class="form">
        <img src="img/logo.png" alt="Logo" class="logo">
        <a href="../login/login.html" class="voltar">←</a>

        <h1>Cadastre-se</h1>
        <p class="subtitulo">Preencha seus dados abaixo.</p>

        <label for="nome">Digite seu nome:</label>
        <input type="text" id="nome" placeholder="Fulano da Silva" required>

        <label for="email">Digite seu endereço de e-mail:</label>
        <input type="email" id="email" placeholder="fulano@gmail.com" required>

        <label for="senha">Crie sua senha:</label>
        <input type="password" id="senha" placeholder="••••••••" required>

        <button type="submit">Criar conta</button>
      </form>
    </section>

    <section class="lado-imagem">
      <img src="img/lateral.png" alt="">
    </section>

  </main>
</body>
</html>
