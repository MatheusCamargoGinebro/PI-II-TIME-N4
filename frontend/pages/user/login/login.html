<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">

    <section class="lado-form">
      <form class="form">
        <img src="img/logo.png" alt="Logo" class="logo">

        <h1>Bem-vindo de volta!</h1>
        <p class="subtitulo">Entre na sua conta abaixo.</p>

        <label for="email">Digite seu endereço de e-mail:</label>
        <input type="email" id="email" placeholder="fulano@gmail.com" required>

        <label for="senha">Digite sua senha:</label>
        <input type="password" id="senha" placeholder="••••••••" required>

        <button type="submit">Entrar</button>

        <a href="../register/register.html" class="link">Ainda não tem uma conta? Crie uma clicando aqui.</a>
      </form>
    </section>

    <section class="lado-imagem">
      <img src="img/lateral.png" alt="">
    </section>

  </main>
</body>
</html>
