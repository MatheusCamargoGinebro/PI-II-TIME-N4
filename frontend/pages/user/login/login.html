<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main >

    <section class="lado-form">
      <form class="form">
        <img src="img/logo.png" alt="Logo" class="logo">
        <p class="text-large text-weight-semibold text-subtitle">Entre na sua conta abaixo.</p>
        <h1 class="h1 text-primary">Bem-vindo de volta!</h1>
        

        <label class="text-label text-regular font-inter" for="email">Digite seu endereço de e-mail:</label>
        <input class="input" type="email" id="email" required placeholder="fulano@gmail.com" autocomplete="email">
        <div id="erroEmail" class="invalid-feedback"></div>


        <label class="text-label text-regular font-inter" for="senha">Digite sua senha:</label>
        <input class="input" type="password" id="senha" placeholder="••••••••" required>
        <div class="form-text">Mínimo de 8 caracteres, 1 Letra maiúscula, minúscula e 1 Caractere especial</div>
        <div id="erroSenha" class="invalid-feedback"></div>        

        <button class="btn btn-full btn-lg primary-btn h6" type="submit">Entrar</button>

        <a class="link" href="../register/register.html" >Ainda não tem uma conta? Crie uma clicando aqui.</a>
      </form>
    </section>

    <section class="lado-imagem">
      <img src="img/lateral.png" alt="">
    </section>

  </main>
</body>
</html>
