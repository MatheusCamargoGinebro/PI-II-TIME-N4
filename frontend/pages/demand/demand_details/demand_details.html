<!--
    Autor: 
    demand_details.html -> Tela de visualização, edição, mudança de status, cancelamento, comentários e histórico de alterações de uma demanda.
-->

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TaskOps - Detalhes da Demanda</title>

		<link rel="icon" href="../../../assets/images/single_white.png" />
		<link rel="stylesheet" href="../../../assets/styles/global.css" />
		<link rel="stylesheet" href="../../../assets/styles/components.css" />
		<link rel="stylesheet" href="./demand_details.css" />
		<script src="https://unpkg.com/lucide@latest"></script>
	</head>
	<body>
		<header id="app-header" class="header"></header>

		<div class="details-subheader">
			<div class="details-breadcrumb">
				<ul>
					<li>
						<a
							href="../../project/projects_list/projects_list.html"
							class="details-breadcrumb-link"
							>Projetos</a
						>
					</li>
					<li>
						<span class="details-breadcrumb-chevron" aria-hidden="true"></span>
					</li>
					<li>
						<a
							id="breadcrumb-project-link"
							href="../../project/project_details/project_details.html"
							class="details-breadcrumb-link"
							>Projeto</a
						>
					</li>
					<li>
						<span class="details-breadcrumb-chevron" aria-hidden="true"></span>
					</li>
					<li>
						<a
							id="breadcrumb-demands-link"
							href="../demands_list/demands_list.html"
							class="details-breadcrumb-link"
							>Demandas</a
						>
					</li>
					<li>
						<span class="details-breadcrumb-chevron" aria-hidden="true"></span>
					</li>
					<li>
						<span class="details-breadcrumb-link"
							><span id="breadcrumb-task-code">...</span></span
						>
					</li>
				</ul>
			</div>

			<div class="demand-details-actions">
				<button
					type="button"
					id="demand-details-cancel-button"
					class="demand-cancel-action"
					data-manager-only
					hidden
				>
					<i data-lucide="ban" class="icon-small"></i>
					Cancelar demanda
				</button>
				<button
					type="button"
					id="demand-details-revert-button"
					class="demand-sleeping-action"
				>
					<span class="demand-details-revert" aria-hidden="true"></span>
					Reverter alterações
				</button>
				<button
					type="button"
					id="demand-details-save"
					class="demand-acivate-action"
				>
					<span class="demand-details-save" aria-hidden="true"></span>
					Salvar alterações
				</button>
			</div>
		</div>

		<div class="details-heading">
			<h1 id="demand-heading-code">Carregando...</h1>
		</div>

		<div class="demand-details-tabs">
			<button
				type="button"
				id="demand-details-info-tab"
				class="demand-details-tab-button demand-details-selected-tab"
			>
				Informações gerais
			</button>
			<button
				type="button"
				id="demand-details-history-tab"
				class="demand-details-tab-button"
			>
				Histórico e anotações
			</button>
		</div>

		<form id="demand-details-forms" novalidate>
			<div class="demand-details-information">
				<div class="demand-details-section-heading">
					<div class="icon-case">
						<span
							class="details-list-icon demand-details-section-heading-icon"
							aria-hidden="true"
						></span>
					</div>
					<p id="demand-section-title">Informações da demanda</p>
				</div>

				<p
					id="demand-readonly-notice"
					class="demand-readonly-notice"
					hidden
				></p>

				<div class="demand-details-form-fields">
					<div
						class="demand-details-form-section demand-details-form-section-title"
					>
						<div class="demand-details-field">
							<label for="demand-details-title">Título da demanda</label>
							<input
								type="text"
								name="demand-title"
								id="demand-details-title"
								maxlength="256"
							/>
							<p id="demand-details-title-error"></p>
						</div>
					</div>

					<div
						class="demand-details-form-section demand-details-form-section-metadata"
					>
						<div class="demand-details-field">
							<label for="demand-details-type">Tipo de demanda</label>
							<select name="demand-type" id="demand-details-type">
								<option value="TAREFA">Tarefa</option>
								<option value="DEFEITO">Defeito</option>
								<option value="MELHORIA">Melhoria</option>
								<option value="DOCUMENTACAO">Documentação</option>
							</select>
						</div>

						<div class="demand-details-field">
							<label for="demand-details-priority">Prioridade</label>
							<select name="demand-priority" id="demand-details-priority">
								<option value="BAIXA">Baixa</option>
								<option value="MEDIA">Média</option>
								<option value="ALTA">Alta</option>
								<option value="CRITICA">Crítica</option>
							</select>
						</div>
					</div>

					<div
						class="demand-details-form-section demand-details-form-section-classification"
					>
						<div class="demand-details-field demand-details-field-project">
							<label for="demand-details-associated-project"
								>Projeto associado</label
							>
							<input
								type="text"
								name="associated-project"
								id="demand-details-associated-project"
								readonly
							/>
							<p id="demand-details-associated-project-error"></p>
						</div>

						<div class="demand-details-field">
							<label for="demand-details-status">Status</label>
							<select name="demand-status" id="demand-details-status">
								<option value="ABERTA">Aberta</option>
								<option value="EM ANDAMENTO">Em andamento</option>
								<option value="EM REVISAO">Em revisão</option>
								<option value="CONCLUIDA">Concluída</option>
								<option value="CANCELADA">Cancelada</option>
							</select>
						</div>
					</div>

					<div
						class="demand-details-form-section demand-details-form-section-description"
					>
						<div class="demand-details-field">
							<label for="demand-details-description">Descrição</label>
							<textarea
								name="demand-description"
								id="demand-details-description"
							></textarea>
						</div>
					</div>
				</div>
			</div>

			<div class="demand-details-sidebar">
				<div class="demand-details-dates">
					<div class="demand-details-section-heading">
						<div class="icon-case">
							<span
								class="date-icon demand-details-section-heading-icon"
								aria-hidden="true"
							></span>
						</div>
						<p>Datas</p>
					</div>

					<p>
						Criado em:
						<span id="demand-created-at">-</span>
					</p>
					<p>
						Atualizado em:
						<span id="demand-updated-at">-</span>
					</p>
					<div class="demand-details-due-field">
						<label for="demand-details-due-date">Prazo:</label>
						<input type="date" id="demand-details-due-date" name="due-date" />
					</div>
					<p id="demand-details-sla-alert" class="demand-details-sla-alert"></p>
				</div>

				<div class="demand-details-users">
					<div class="demand-details-section-heading">
						<div class="icon-case">
							<span
								class="users-icon demand-details-section-heading-icon"
								aria-hidden="true"
							></span>
						</div>
						<p>Usuários</p>
					</div>

					<div class="demand-details-requester-section">
						<p>Usuário solicitante</p>
						<div class="demand-details-requester">
							<img
								id="demand-details-requester-avatar"
								src="../../../assets/images/user.png"
								alt="Usuário solicitante"
							/>
							<div>
								<p id="demand-details-requester-name">Carregando...</p>
								<p id="demand-details-requester-role">Criador da demanda</p>
							</div>
						</div>
					</div>

					<div class="demand-details-assignee-section">
						<p>Usuário designado</p>
						<div class="demand-details-assignee" id="demand-assignee-card">
							<div class="demand-details-assignee-info">
								<img
									id="demand-details-assignee-avatar"
									src="../../../assets/images/user.png"
									alt="Usuário designado"
								/>
								<div>
									<p id="demand-details-assignee-name">Não atribuído</p>
									<p id="demand-details-assignee-role">Sem responsável</p>
								</div>
							</div>
							<span
								class="demand-details-assignee-chevron"
								aria-hidden="true"
							></span>
						</div>
					</div>
				</div>
			</div>
		</form>

		<form id="demand-logs-forms" style="display: none">
			<div class="demand-details-section-heading">
				<div class="icon-case">
					<span
						class="demand-details-history-icon demand-details-history-main-icon"
						aria-hidden="true"
					></span>
				</div>
				<p>Histórico e anotações da demanda</p>
			</div>

			<div class="demand-details-comment-form">
				<div class="demand-details-comment-field">
					<label for="demand-details-comment">Adicionar comentário</label>
					<textarea
						name="demand-comment"
						id="demand-details-comment"
						placeholder="Escreva um comentário ou atualização sobre a demanda..."
					></textarea>
				</div>
				<div class="demand-details-comment-submit">
					<button type="button" id="demand-details-comment-button">
						Comentar
					</button>
				</div>
			</div>

			<div class="demand-details-history-divider" aria-hidden="true"></div>

			<div class="demand-details-history" id="demand-history-list">
				<p class="text-subtitle font-inter text-small">
					Carregando histórico...
				</p>
			</div>
		</form>

		<script type="module" src="./demand_details.js"></script>
	</body>
</html>
