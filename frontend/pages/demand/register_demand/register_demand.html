<!--
    Autor: 
    register_demand.html -> Tela de cadastro de nova demanda com validação de campos, seleção de projeto/responsável e validação de feriados nacionais no prazo.
-->

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TaskOps - Cadastro de Demanda</title>

		<link rel="stylesheet" href="./register_demand.css" />
		<script src="https://unpkg.com/lucide@latest"></script>
	</head>

	<body>
		<header id="app-header" class="header"></header>

		<main class="page">
			<section class="form-card">
				<h1>Cadastro de Demanda</h1>

				<form id="demanda-form" novalidate>
					<!-- Título -->
					<div class="form-group name-group">
						<label for="nome">Título</label>
						<input
							type="text"
							id="nome"
							name="nome"
							class="form-control"
							placeholder="Título da demanda"
							minlength="3"
							maxlength="256"
							required
						/>
						<small class="mensagem-erro" id="erro-nome"></small>
					</div>

					<!-- Descrição -->
					<div class="form-group description-group">
						<label for="descricao">Descrição</label>
						<textarea
							id="descricao"
							name="descricao"
							class="form-control"
							placeholder="Descreva a demanda em detalhes..."
							minlength="10"
							maxlength="2000"
							required
						></textarea>
						<small class="mensagem-erro" id="erro-descricao"></small>
					</div>

					<!-- Projeto e Tipo -->
					<div class="fields-row">
						<div class="form-group">
							<label for="projeto">Projeto</label>
							<div class="select-wrapper">
								<select
									id="projeto"
									name="projeto"
									class="form-control"
									required
								>
									<option value="" selected disabled>
										Carregando projetos...
									</option>
								</select>
								<span class="select-arrow">
									<i data-lucide="chevron-down" class="icon-small"></i>
								</span>
							</div>
							<small class="mensagem-erro" id="erro-projeto"></small>
						</div>

						<div class="form-group">
							<label for="tipo">Tipo</label>
							<div class="select-wrapper">
								<select id="tipo" name="tipo" class="form-control" required>
									<option value="TAREFA" selected>Tarefa</option>
									<option value="DEFEITO">Defeito</option>
									<option value="MELHORIA">Melhoria</option>
									<option value="DOCUMENTACAO">Documentação</option>
								</select>
								<span class="select-arrow">
									<i data-lucide="chevron-down" class="icon-small"></i>
								</span>
							</div>
							<small class="mensagem-erro" id="erro-tipo"></small>
						</div>
					</div>

					<!-- Prioridade e Prazo -->
					<div class="fields-row">
						<div class="form-group">
							<label for="prioridade">Prioridade</label>
							<div class="select-wrapper">
								<select
									id="prioridade"
									name="prioridade"
									class="form-control"
									required
								>
									<option value="" selected disabled>
										Selecione uma opção...
									</option>
									<option value="BAIXA">Baixa</option>
									<option value="MEDIA">Média</option>
									<option value="ALTA">Alta</option>
									<option value="CRITICA">Crítica</option>
								</select>
								<span class="select-arrow">
									<i data-lucide="chevron-down" class="icon-small"></i>
								</span>
							</div>
							<small class="mensagem-erro" id="erro-prioridade"></small>
						</div>

						<div class="form-group">
							<label for="prazo">Prazo de finalização (opcional)</label>
							<input type="date" id="prazo" name="prazo" class="form-control" />
							<small class="mensagem-erro" id="erro-prazo"></small>
						</div>
					</div>

					<!-- Responsável -->
					<div class="responsible-group">
						<div class="form-group">
							<label for="responsavel">Responsável (opcional)</label>
							<div class="select-wrapper">
								<select
									id="responsavel"
									name="responsavel"
									class="form-control"
								>
									<option value="">Nenhum (não atribuído)</option>
								</select>
								<span class="select-arrow">
									<i data-lucide="chevron-down" class="icon-small"></i>
								</span>
							</div>
							<small class="mensagem-erro" id="erro-responsavel"></small>
						</div>
					</div>

					<p
						id="mensagem-formulario"
						class="mensagem-geral"
						role="status"
						aria-live="polite"
					></p>

					<!-- Botões -->
					<div class="actions">
						<a
							href="../../dashboard/dashboard.html"
							class="btn-cancel"
							id="botao-cancelar"
						>
							<i data-lucide="x" class="icon-small"></i>
							<span>Cancelar</span>
						</a>

						<button type="submit" class="btn-save" id="botao-salvar">
							<i data-lucide="save" class="icon-small"></i>
							<span>Salvar</span>
						</button>
					</div>
				</form>
			</section>
		</main>

		<script type="module" src="./register_demand.js"></script>
	</body>
</html>
