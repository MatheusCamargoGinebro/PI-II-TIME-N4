<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskOps - Cadastro/Edição de Demanda</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- barra superior -->

    <header class="topbar">

        <nav class="navbar">

            <a href="#" class="brand">

                <span class="brand-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6.5h9.5M4 11.5h5.5M4 16.5h8"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"/>

                        <path d="M15 14l2 2 4-5"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"/>

                        <path d="M3 3h14v4"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="1.8"
                              stroke-linecap="round"/>
                    </svg>
                </span>

                <span>TaskOps</span>

            </a>


            <a href="#" class="nav-link">
                Dashboard
            </a>

            <a href="#" class="nav-link active">
                Projetos
            </a>

        </nav>


        <!-- usuário -->

        <div class="user-menu">

            <div class="avatar">
                <span>👩🏻‍💼</span>
            </div>

            <div class="user-info">

                <strong>
                    Fulano da S.
                </strong>

                <span>
                    fulano@email.com
                </span>

            </div>

            <button
                type="button"
                class="dropdown-button"
                aria-label="Abrir menu">

                <svg viewBox="0 0 24 24">
                    <path d="m7 9 5 5 5-5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>

            </button>

        </div>

    </header>


    <!-- página -->

    <main class="page">

        <!-- caixa principal -->

        <section class="form-card">

            <h1>
                Cadastro/Edição de Demanda
            </h1>


            <form>

                <!-- nome -->

                <div class="form-group name-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Placeholder">

                </div>


                <!-- descrição -->

                <div class="form-group description-group">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        placeholder="Type your message..."></textarea>

                </div>


                <!-- prioridade e status -->

                <div class="fields-row">

                    <div class="form-group">

                        <label for="prioridade">
                            Prioridade
                        </label>

                        <div class="select-wrapper">

                            <select
                                id="prioridade"
                                name="prioridade">

                                <option value="" selected disabled>
                                    Select one...
                                </option>

                                <option value="baixa">
                                    Baixa
                                </option>

                                <option value="media">
                                    Média
                                </option>

                                <option value="alta">
                                    Alta
                                </option>

                            </select>


                            <span class="select-arrow">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="m7 10 5 5 5-5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>

                                </svg>

                            </span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <div class="select-wrapper">

                            <select
                                id="status"
                                name="status">

                                <option value="" selected disabled>
                                    Select one...
                                </option>

                                <option value="pendente">
                                    Pendente
                                </option>

                                <option value="andamento">
                                    Em andamento
                                </option>

                                <option value="concluido">
                                    Concluído
                                </option>

                            </select>


                            <span class="select-arrow">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="m7 10 5 5 5-5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>

                                </svg>

                            </span>

                        </div>

                    </div>

                </div>


                <!-- responsável -->

                <div class="responsible-group">

                    <div class="form-group">

                        <label for="responsavel">
                            Responsável
                        </label>

                        <div class="select-wrapper">

                            <select
                                id="responsavel"
                                name="responsavel">

                                <option value="" selected disabled>
                                    Select one...
                                </option>

                                <option value="fulano">
                                    Fulano da S.
                                </option>

                                <option value="ciclano">
                                    Ciclano
                                </option>

                                <option value="beltrano">
                                    Beltrano
                                </option>

                            </select>


                            <span class="select-arrow">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="m7 10 5 5 5-5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>

                                </svg>

                            </span>

                        </div>

                    </div>

                </div>


                <!-- botões -->

                <div class="actions">

                    <button
                        type="button"
                        class="button button-cancel">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 3 4.5 7v10L12 21l7.5-4V7L12 3Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"/>

                            <path
                                d="M4.5 7 12 11l7.5-4M12 11v10"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"/>

                        </svg>

                        <span>
                            Cancelar
                        </span>

                    </button>


                    <button
                        type="submit"
                        class="button button-save">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 3 4.5 7v10L12 21l7.5-4V7L12 3Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"/>

                            <path
                                d="M4.5 7 12 11l7.5-4M12 11v10"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"/>

                        </svg>

                        <span>
                            Salvar
                        </span>

                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
