<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskOps - Cadastro/Edição de Demanda</title>

    <link rel="stylesheet" href="../../assets/styles/global.css">
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- barra superior -->

    <header class="header">
        <nav class="nav">
            <img src="../../assets/images/logo.png" alt="TaskOps" />

            <ul class="nav-list">
                <li><a href="../dashboard/dashboard.html" class="btn btn-lg ghost-btn">Dashboard</a></li>
                <li><a href="../project/projects_list/projects_list.html" class="btn btn-lg primary-btn">Projetos</a></li>
            </ul>
        </nav>

        <div class="user-profile">
            <div class="align-center gap-16">
                <img class="user-profile-avatar" src="../../assets/images/user.png" alt="Avatar" />
                <div class="user-profile-info">
                    <p class="user-profile-name text-large">Fulano da S.</p>
                    <p class="user-profile-email font-inter text-tiny text-subtitle">fulano@email.com</p>
                </div>
            </div>
            <i data-lucide="chevron-down" class="icon-medium" style="color: var(--color-primary-500)"></i>
        </div>
    </header>


    <!-- página -->

    <main class="page">

        <!-- caixa principal -->

        <section class="form-card">

            <h1>
                Cadastro/Edição de Demanda
            </h1>


            <form id="demanda-form" novalidate>

                <!-- nome -->

                <div class="form-group name-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Placeholder"
                        minlength="3"
                        maxlength="100"
                        required>

                    <small class="mensagem-erro" id="erro-nome"></small>

                </div>


                <!-- descrição -->

                <div class="form-group description-group">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        placeholder="Type your message..."
                        minlength="10"
                        maxlength="500"
                        required></textarea>

                    <small class="mensagem-erro" id="erro-descricao"></small>

                </div>


                <!-- prioridade e status -->

                <div class="fields-row">

                    <div class="form-group">

                        <label for="prioridade">
                            Prioridade
                        </label>

                        <div class="select-wrapper">

                            <select
                                id="prioridade"
                                name="prioridade"
                                required>

                                <option value="" selected disabled>
                                    Select one...
                                </option>

                                <option value="baixa">
                                    Baixa
                                </option>

                                <option value="media">
                                    Média
                                </option>

                                <option value="alta">
                                    Alta
                                </option>

                            </select>


                            <span class="select-arrow">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="m7 10 5 5 5-5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>

                                </svg>

                            </span>

                        </div>

                        <small class="mensagem-erro" id="erro-prioridade"></small>

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <div class="select-wrapper">

                            <select
                                id="status"
                                name="status"
                                required>

                                <option value="" selected disabled>
                                    Select one...
                                </option>

                                <option value="pendente">
                                    Pendente
                                </option>

                                <option value="andamento">
                                    Em andamento
                                </option>

                                <option value="concluido">
                                    Concluído
                                </option>

                            </select>


                            <span class="select-arrow">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="m7 10 5 5 5-5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>

                                </svg>

                            </span>

                        </div>

                        <small class="mensagem-erro" id="erro-status"></small>

                    </div>

                </div>


                <!-- responsável -->

                <div class="responsible-group">

                    <div class="form-group">

                        <label for="responsavel">
                            Responsável
                        </label>

                        <div class="select-wrapper">

                            <select
                                id="responsavel"
                                name="responsavel"
                                required>

                                <option value="" selected disabled>
                                    Select one...
                                </option>

                                <option value="fulano">
                                    Fulano da S.
                                </option>

                                <option value="ciclano">
                                    Ciclano
                                </option>

                                <option value="beltrano">
                                    Beltrano
                                </option>

                            </select>


                            <span class="select-arrow">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="m7 10 5 5 5-5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>

                                </svg>

                            </span>

                        </div>

                        <small class="mensagem-erro" id="erro-responsavel"></small>

                    </div>

                </div>


                <p id="mensagem-formulario" class="mensagem-geral" role="status" aria-live="polite"></p>

                <!-- botões -->

                <div class="actions">

                    <button
                        type="button"
                        class="button button-cancel"
                        id="botao-cancelar">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 3 4.5 7v10L12 21l7.5-4V7L12 3Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"/>

                            <path
                                d="M4.5 7 12 11l7.5-4M12 11v10"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"/>

                        </svg>

                        <span>
                            Cancelar
                        </span>

                    </button>


                    <button
                        type="submit"
                        class="button button-save">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 3 4.5 7v10L12 21l7.5-4V7L12 3Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"/>

                            <path
                                d="M4.5 7 12 11l7.5-4M12 11v10"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"/>

                        </svg>

                        <span>
                            Salvar
                        </span>

                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="validacao.js" defer></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
