<!--
    Arquivo de entrypoint: redireciona o usuário para o Dashboard ou Login conforme o token JWT armazenado.
    Autor: 
-->

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TaskOps - Sistema de Acompanhamento de Demandas</title>

		<link rel="stylesheet" href="./assets/styles/global.css" />
		<script>
			const token = localStorage.getItem("token");
			if (token) {
				window.location.href = "./pages/dashboard/dashboard.html";
			} else {
				window.location.href = "./pages/user/login/login.html";
			}
		</script>
	</head>
	<body id="app">
		<main class="container" style="padding-top: 48px">
			<p class="text-subtitle font-inter">Redirecionando para o TaskOps...</p>
		</main>
	</body>
</html>
